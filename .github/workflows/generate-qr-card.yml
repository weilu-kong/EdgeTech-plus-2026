name: Generate QR card

on:
  push:
    paths:
      - "scripts/generate_qr_card.py"
      - ".github/workflows/generate-qr-card.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fonts and Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install pillow qrcode[pil]

      - name: Generate PNG
        run: python scripts/generate_qr_card.py

      - name: Commit generated asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/qr-homepage-card.png poster.html
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Generate verified QR homepage card PNG"
            git push
          fi
