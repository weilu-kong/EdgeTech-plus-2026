name: Render Chinese A0 Poster PDF

on:
  push:
    branches:
      - poster-zh-cn
    paths:
      - .github/workflows/render-zh-poster-pdf.yml

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout poster branch
        uses: actions/checkout@v4

      - name: Install CJK fonts and renderer
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
          npm install --no-save puppeteer-core@24

      - name: Render screen layout directly to exact A0 PDF
        shell: bash
        run: |
          set -euxo pipefail
          export CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          node <<'NODE'
          const path = require('path');
          const puppeteer = require('puppeteer-core');
          (async () => {
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROME_PATH,
              headless: true,
              args: ['--no-sandbox', '--disable-gpu', '--allow-file-access-from-files']
            });
            const page = await browser.newPage();
            await page.setViewport({width: 1706, height: 2400, deviceScaleFactor: 1});
            const url = 'file://' + path.resolve('poster.html');
            await page.goto(url, {waitUntil: 'networkidle0', timeout: 60000});
            await page.emulateMediaType('screen');
            await page.evaluate(() => {
              const poster = document.getElementById('poster');
              const stage = document.getElementById('stage');
              poster.style.transform = 'none';
              poster.style.transformOrigin = 'top left';
              stage.style.width = '1682px';
              stage.style.height = '2378px';
            });
            await page.evaluate(() => document.fonts.ready);
            await new Promise(r => setTimeout(r, 1000));
            await page.pdf({
              path: 'EdgeTech2026_zh-CN_A0.pdf',
              width: '841mm',
              height: '1189mm',
              scale: 1.88941736,
              printBackground: true,
              margin: {top: '0mm', right: '0mm', bottom: '0mm', left: '0mm'},
              preferCSSPageSize: false
            });
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
          test -s EdgeTech2026_zh-CN_A0.pdf
          ls -lh EdgeTech2026_zh-CN_A0.pdf
          if command -v pdfinfo >/dev/null 2>&1; then
            pdfinfo EdgeTech2026_zh-CN_A0.pdf | tee pdfinfo.txt
          else
            printf 'pdfinfo unavailable on runner\n' > pdfinfo.txt
          fi

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: EdgeTech2026-zh-CN-A0-PDF
          path: |
            EdgeTech2026_zh-CN_A0.pdf
            pdfinfo.txt
          if-no-files-found: error
          retention-days: 1
