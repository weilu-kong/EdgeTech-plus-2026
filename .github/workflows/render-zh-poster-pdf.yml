name: Render Chinese A0 Poster PDF

on:
  push:
    branches:
      - poster-zh-cn
    paths:
      - .github/workflows/render-zh-poster-pdf.yml

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout poster branch
        uses: actions/checkout@v4

      - name: Prepare A0 print CSS
        shell: python
        run: |
          from pathlib import Path
          p = Path("poster.html")
          html = p.read_text(encoding="utf-8")
          css = '<style>@page { size: 841mm 1189mm; margin: 0; } html,body { margin: 0 !important; padding: 0 !important; }</style>'
          if css not in html:
              html = html.replace("</head>", css + "\n</head>")
          p.write_text(html, encoding="utf-8")

      - name: Install lightweight PDF renderer
        shell: bash
        run: npm install --no-save puppeteer-core@24

      - name: Render exact A0 PDF
        shell: bash
        run: |
          set -euxo pipefail
          export CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          node <<'NODE'
          const path = require('path');
          const puppeteer = require('puppeteer-core');
          (async () => {
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROME_PATH,
              headless: true,
              args: ['--no-sandbox', '--disable-gpu', '--allow-file-access-from-files']
            });
            const page = await browser.newPage();
            const url = 'file://' + path.resolve('poster.html');
            await page.goto(url, {waitUntil: 'networkidle0', timeout: 60000});
            await page.emulateMediaType('print');
            await page.pdf({
              path: 'EdgeTech2026_zh-CN_A0.pdf',
              width: '841mm',
              height: '1189mm',
              printBackground: true,
              margin: {top: '0mm', right: '0mm', bottom: '0mm', left: '0mm'},
              preferCSSPageSize: false
            });
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
          test -s EdgeTech2026_zh-CN_A0.pdf
          ls -lh EdgeTech2026_zh-CN_A0.pdf
          if command -v pdfinfo >/dev/null 2>&1; then
            pdfinfo EdgeTech2026_zh-CN_A0.pdf | tee pdfinfo.txt
          else
            printf 'pdfinfo unavailable on runner\n' > pdfinfo.txt
          fi

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: EdgeTech2026-zh-CN-A0-PDF
          path: |
            EdgeTech2026_zh-CN_A0.pdf
            pdfinfo.txt
          if-no-files-found: error
          retention-days: 1
